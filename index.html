<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    #unity-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: block;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 10;
    }
    #loading-text { margin-bottom: 15px; }
    #progress-container {
      width: 40%;
      height: 10px;
      background: #222;
      border-radius: 5px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: #09f;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div id="loading-text">Loading...</div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <canvas id="unity-canvas" width="694" height="646" style="cursor: default;"></canvas>

  <!-- Loader CDN -->
  <script src="https://cdn.jsdelivr.net/gh/kelsimsk/ugil@main/Build/ultrakill.loader.js"></script>

  <script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
    }

    const loadingScreen = document.getElementById("loading-screen");
    const progressBar = document.getElementById("progress-bar");
    const loadingText = document.getElementById("loading-text");

    // Fetch files with retry logic and parallel execution for speed/reliability
    async function fetchPartWithRetry(url, maxRetries = 3) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return await res.arrayBuffer();
        } catch (err) {
          if (attempt === maxRetries) throw err;
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
      }
    }

    async function mergeParts(baseName, totalParts, barStart, barEnd) {
      let loadedParts = 0;
      const promises = Array.from({ length: totalParts }, (_, i) => {
        const url = `https://cdn.jsdelivr.net/gh/kelsimsk/ugil@main/Build/${baseName}.part${i}`;
        return fetchPartWithRetry(url).then(buffer => {
          loadedParts++;
          const progress = barStart + (loadedParts / totalParts) * (barEnd - barStart);
          progressBar.style.width = progress + "%";
          return buffer;
        });
      });

      const parts = await Promise.all(promises);
      const blob = new Blob(parts, { type: "application/octet-stream" });
      return URL.createObjectURL(blob);
    }

    (async () => {
      const dataParts = 4;
      const wasmParts = 3;

      try {
        loadingText.textContent = "Downloading assets...";

        // Download data and WASM files simultaneously
        const [dataUrl, wasmUrl] = await Promise.all([
          mergeParts("ultrakill.data.unityweb", dataParts, 0, 40),
          mergeParts("ultrakill.wasm.unityweb", wasmParts, 40, 80)
        ]);

        loadingText.textContent = "Starting Engine...";

        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: dataUrl,
          frameworkUrl: "https://cdn.jsdelivr.net/gh/kelsimsk/ugil@main/Build/ultrakill.framework.js.unityweb",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Hakita",
          productName: "ULTRAKILL WEB PORT",
          productVersion: "1.5",
        }, (progress) => {
          const percent = 80 + progress * 20;
          progressBar.style.width = percent + "%";
        }).then(() => {
          loadingScreen.style.display = "none";
        }).catch((err) => {
          loadingText.textContent = "Error loading game: " + err;
          loadingText.style.color = "red";
        });
      } catch (e) {
        loadingText.textContent = "Network Error: " + e.message;
        loadingText.style.color = "red";
      }
    })();
  </script>
</body>
</html>
